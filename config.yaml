# Library Clerk Configuration
# ============================

library:
  # Directories to scan for publications
  paths:
    - ~/papers
    - ~/books
    - ~/library
  # File extensions to process
  extensions:
    - .pdf
    - .epub

# ─── LLM backend ───────────────────────────────────────────────────
# Set "backend" to one of: ollama, claude, perplexity
# Only the active backend section needs to be filled in.
# The "ollama" section is also read as a fallback when "llm" is absent.
#
# To switch backend, uncomment the desired section below and comment
# out the others, or simply change the "backend:" value.

# -- Option A: Local inference via Ollama (default) --
llm:
  backend: ollama
  base_url: http://localhost:11434
  classifier_model: ministral-3:3b
  # qwen2.5:7b recommended — strong at both structured JSON and semantic reasoning
  # alternatives: mistral:7b, deepseek-r1:8b, phi4-mini, gemma2:9b
  ontology_model: qwen2.5:7b
  max_chunk_tokens: 4000
  # Context window in tokens.  Ollama defaults to only 2048 regardless of
  # what the model supports, which silently truncates our prompts (~3800+
  # tokens for Stage 1).  8192 covers all prompts with room for output.
  num_ctx: 8192
  # Request timeout in seconds (auto-scaled 5× on CPU-only machines)
  timeout: 300

# -- Option B: Anthropic Claude API --
# llm:
#   backend: claude
#   api_key: sk-ant-...              # or set ANTHROPIC_API_KEY env var
#   classifier_model: claude-sonnet-4-20250514
#   ontology_model: claude-sonnet-4-20250514
#   max_tokens: 4096                 # max output tokens per request

# -- Option C: Perplexity Pro API --
# llm:
#   backend: perplexity
#   api_key: pplx-...                # or set PERPLEXITY_API_KEY env var
#   classifier_model: sonar-pro
#   ontology_model: sonar-pro
#   max_tokens: 4096

# Legacy section — still supported when "llm" is absent.
ollama:
  base_url: http://localhost:11434
  classifier_model: ministral-3:3b
  ontology_model: qwen2.5:7b
  max_chunk_tokens: 4000
  num_ctx: 8192
  timeout: 300

graph:
  # Backend: "networkx" (lightweight, no server needed) or "neo4j"
  backend: networkx
  neo4j:
    uri: bolt://localhost:7687
    user: neo4j
    password: password
    database: libraryClerk

persistence:
  # SQLite database file for caching all processed data
  database: library_clerk.db

server:
  host: 0.0.0.0
  port: 5000
  debug: false
