# Library Clerk Configuration
# ============================

library:
  # Directories to scan for publications
  paths:
    - ~/papers
    - ~/books
    - ~/library
  # File extensions to process
  extensions:
    - .pdf
    - .epub

# ─── LLM backend ───────────────────────────────────────────────────
# Set "backend" to one of: ollama, claude, perplexity
# Then fill in the matching sub-section below.
llm:
  backend: ollama

  ollama:
    base_url: http://localhost:11434
    classifier_model: ministral-3:3b
    # qwen2.5:7b recommended — strong at structured JSON and semantic reasoning
    # alternatives: mistral:7b, deepseek-r1:8b, phi4-mini, gemma2:9b
    ontology_model: qwen2.5:7b
    max_chunk_tokens: 4000
    # Ollama defaults to only 2048 tokens context regardless of the model.
    # Our prompts need ~3800+ tokens, so 8192 is the safe minimum.
    num_ctx: 8192
    # Request timeout in seconds (auto-scaled 5× on CPU-only machines)
    timeout: 300

  claude:
    # Paste your key inside the quotes, or set ANTHROPIC_API_KEY env var
    api_key: ""
    classifier_model: claude-sonnet-4-20250514
    ontology_model: claude-sonnet-4-20250514
    max_tokens: 4096

  perplexity:
    # Paste your key inside the quotes, or set PERPLEXITY_API_KEY env var
    api_key: ""
    classifier_model: sonar-pro
    ontology_model: sonar-pro
    max_tokens: 4096

graph:
  # Backend: "networkx" (lightweight, no server needed) or "neo4j"
  backend: networkx
  neo4j:
    uri: bolt://localhost:7687
    user: neo4j
    password: password
    database: libraryClerk

persistence:
  # SQLite database file for caching all processed data
  database: library_clerk.db

server:
  host: 0.0.0.0
  port: 5000
  debug: false
